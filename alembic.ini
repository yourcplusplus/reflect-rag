# Alembic configuration for the ReflectRAG API database.
#
#   alembic upgrade head        # create/refresh conversations, messages, documents
#   alembic revision --autogenerate -m "..."   # after editing project/api/db/models.py
#
# The database URL is NOT set here: project/api/migrations/env.py reads it from
# the environment (DATABASE_URL) through api/settings.py, so the migrations and
# the running API can never disagree about which database they mean.

[alembic]
script_location = project/api/migrations
# Make `api` importable when alembic runs from the repository root.
prepend_sys_path = project
file_template = %%(year)d%%(month).2d%%(day).2d_%%(hour).2d%%(minute).2d_%%(rev)s_%%(slug)s
timezone = UTC

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S

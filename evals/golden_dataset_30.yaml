  question: Reflexion（2303.11366）和 Agentic RAG 综述（2501.09136）分别提出了什么核心机制来增强 LLM 性能？二者的方法路径有何不同？
  ground_truth: Paper A (2303.11366) proposes "Reflexion," a framework that equips agents with dynamic memory and self-reflection capabilities, allowing them to verbally reflect on task feedback signals
    and maintain reflective text in an episodic memory buffer to induce better decision-making in subsequent trials. Paper B (2501.09136) proposes "Agentic Retrieval-Augmented Generation" (Agentic RAG),
    a paradigm that incorporates autonomous agents into the RAG pipeline, enabling them to dynamically manage retrieval strategies, iteratively refine contextual understanding, and adapt workflows through
    reflection or planning. While Paper A focuses on self-reflection as a mechanism for learning from failures across trials to improve reasoning and decision-making, Paper B focuses on agent-driven retrieval
    orchestration to enhance contextual grounding and generation quality. Both approaches leverage agentic capabilities, but Paper A emphasizes verbal reinforcement learning through self-reflection, whereas
    Paper B emphasizes autonomous retrieval management and adaptive workflow orchestration.
  gold_evidence:
  - Reflexion is a framework that equips agents with dynamic memory and self-reflection capabilities to enhance their future reasoning and decision-making. It allows agents to verbally reflect on task feedback
    signals, maintain reflective text in an episodic memory buffer, and induce better decision-making in subsequent trials.
  - Agentic Retrieval-Augmented Generation (Agentic RAG) is a paradigm that incorporates autonomous agents into the RAG pipeline, enabling them to dynamically manage retrieval strategies, iteratively refine
    contextual understanding, and adapt workflows through reflection or planning.
  provenance: llm_synthesized

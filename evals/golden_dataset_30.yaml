- _key:
  - single_paper_factual
  - '2401.18059'
  question: RAPTOR 是什么？它如何构建层次化的树结构？
  ground_truth: RAPTOR 是一种新颖的基于树的检索系统，它用不同抽象层级的上下文信息来增强大语言模型的参数化知识。它通过递归的聚类和摘要技术，构建出一个能够跨检索语料库各个部分综合信息的层次化树结构。在查询阶段，RAPTOR 利用该树结构进行更有效的检索。
  gold_evidence:
  - In this paper, we have presented RAPTOR, a novel tree-based retrieval system that augments the parametric knowledge of large language models with contextual information at various levels of abstraction.
    By employing recursive clustering and summarization techniques, RAPTOR creates a hierarchical tree structure that is capable of synthesizing information across various sections of the retrieval corpora.
  provenance: extractive
  source_papers:
  - '2401.18059'
  source_sections:
  - 2401.18059#(front matter)
  expected_intent: simple_faq
  expected_behavior: answer
  audit:
    section: (front matter)
  verification:
    supported: false
    reason: 证据仅说明 RAPTOR 是树基检索系统、通过递归聚类和摘要构建层次树，但未提及“在查询阶段利用该树结构进行更有效的检索”这一事实。
  query_type: single_paper_factual
  id: spf-006
  review_status: approved
  notes: 全文核查 approved
- _key:
  - single_paper_factual
  - '2002.08909'
  question: REALM 如何增强语言模型预训练？
  ground_truth: REALM 用一个神经知识检索器来增强语言模型预训练，该检索器从文本知识语料库 Z（例如整个 Wikipedia）中检索知识。语言建模目标的信号会一直反向传播穿过检索器，而检索器必须考虑 Z 中的数百万篇文档，这是一个显著的计算挑战。
  gold_evidence:
  - REALM augments language model pre-training with a neural knowledge retriever that retrieves knowledge from a textual knowledge corpus, Z (e.g., all of Wikipedia). Signal from the language modeling objective
    backpropagates all the way through the retriever, which must consider millions of documents in Z—a significant computational challenge that we address.
  provenance: extractive
  source_papers:
  - '2002.08909'
  source_sections:
  - 2002.08909#(front matter)
  expected_intent: simple_faq
  expected_behavior: answer
  audit:
    section: (front matter)
  verification:
    supported: true
    reason: 证据逐句对应了声称的真实答案：神经知识检索器、从文本知识语料库Z（如整个Wikipedia）检索、语言建模信号反向传播穿过检索器、需考虑数百万文档的计算挑战，均被证据完整覆盖。
  query_type: single_paper_factual
  id: spf-007
  review_status: approved
  notes: ''
- _key:
  - single_paper_factual
  - '2210.03629'
  question: ReAct 这篇论文的核心思想是什么？
  ground_truth: ReAct 提出了一种让语言模型在交错进行的推理轨迹与任务特定动作之间协同工作的通用范式。在该范式中，推理轨迹帮助模型归纳、追踪和更新行动计划，并处理异常情况；而动作则使模型能够与外部环境（如知识库或环境）交互并收集额外信息。该方法在语言理解和交互式决策任务上都取得了优于单纯推理或单纯行动基线的效果。
  gold_evidence:
  - 'We explore the use of large language models (LLMs) to generate both reasoning traces and task-specific actions in an interleaved manner, allowing for greater synergy between the two: reasoning traces
    help the model induce, track, and update action plans as well as handle exceptions, while actions allow it to interface with external sources, such as knowledge bases or environments, to gather additional
    information.'
  provenance: extractive
  source_papers:
  - '2210.03629'
  source_sections:
  - 2210.03629#(front matter)
  expected_intent: simple_faq
  expected_behavior: answer
  audit:
    section: (front matter)
  verification:
    supported: false
    reason: 证据仅描述了 ReAct 的交错推理-动作范式及其作用，未提及该方法在语言理解和交互式决策任务上优于单纯推理或单纯行动基线的实验结果，故该部分事实缺乏证据支持。
  query_type: single_paper_factual
  id: spf-008
  review_status: approved
  notes: 全文核查 approved
- _key:
  - single_paper_factual
  - '2310.11511'
  question: SELF-RAG 通过什么方式提升大语言模型的事实准确性？
  ground_truth: SELF-RAG 是一个通过自我反思来学习检索、生成和批判的框架。它通过反思令牌（reflection tokens）提升大语言模型的事实准确性，这些令牌使模型能够自适应地按需检索，并对其自身生成内容进行自我批判。
  gold_evidence:
  - We introduce Self-Reflective Retrieval-Augmented Generation (SELF-RAG) that enhances an LM's quality and factuality through retrieval and self-reflection.
  provenance: extractive
  source_papers:
  - '2310.11511'
  source_sections:
  - 2310.11511#(front matter)
  expected_intent: simple_faq
  expected_behavior: answer
  audit:
    section: (front matter)
  verification:
    supported: false
    reason: 证据仅提到 SELF-RAG 通过检索和自我反思提升质量与事实性，未提及反思令牌、自适应按需检索或自我批判等具体机制。
  query_type: single_paper_factual
  id: spf-009
  review_status: approved
  notes: 全文核查 approved
- _key:
  - single_paper_factual
  - '2303.17651'
  question: SELF-REFINE 是什么？它的主要思想是什么？
  ground_truth: SELF-REFINE 是一种通过迭代反馈与改进来提升大语言模型初始输出的方法。其核心思想是先用 LLM 生成一个初始输出，然后由同一个 LLM 为其输出提供反馈，并据此迭代地改进自身。它不需要任何监督训练数据、额外训练或强化学习，而是使用单个 LLM 同时充当生成器、改进器和反馈提供者。
  gold_evidence:
  - Motivated by how humans refine their written text, we introduce SELF-REFINE, an approach for improving initial outputs from LLMs through iterative feedback and refinement. The main idea is to generate
    an initial output using an LLM; then, the same LLM provides _feedback_ for its output and uses it to _refine_ itself, iteratively. SELF-REFINE does not require any supervised training data, additional
    training, or reinforcement learning, and instead uses a single LLM as the generator, refiner and the feedback provider.
  provenance: extractive
  source_papers:
  - '2303.17651'
  source_sections:
  - 2303.17651#(front matter)
  expected_intent: simple_faq
  expected_behavior: answer
  audit:
    section: (front matter)
  verification:
    supported: true
    reason: 证据完整覆盖了 SELF-REFINE 的定义、核心思想（同一 LLM 迭代反馈与改进）以及无需监督数据/额外训练/强化学习、单模型充当三种角色等全部要点。
  query_type: single_paper_factual
  id: spf-010
  review_status: approved
  notes: ''
- _key:
  - single_paper_factual
  - '2302.04761'
  question: Toolformer 是什么？它是如何训练的？
  ground_truth: Toolformer 是一个被训练来决定调用哪些 API、何时调用、传递什么参数，以及如何最好地将结果纳入未来 token 预测的模型。它的训练以自监督方式进行，每个 API 只需要少量演示。
  gold_evidence:
  - We introduce _Toolformer_ , a model trained to decide which APIs to call, when to call them, what arguments to pass, and how to best incorporate the results into future token prediction. This is done
    in a self-supervised way, requiring nothing more than a handful of demonstrations for each API.
  provenance: extractive
  source_papers:
  - '2302.04761'
  source_sections:

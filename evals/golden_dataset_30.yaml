    reason: 证据完整包含 Toolformer 的定义（决定调用哪些 API、何时调用、传参、将结果纳入未来 token 预测）及其自监督训练方式（每个 API 仅需少量演示），与 ground truth 完全一致。
  query_type: single_paper_factual
  id: spf-011
  review_status: approved
  notes: ''

- _key:
  - cross_paper_comparison
  - '2404.16130'
  - '2401.18059'
  question: Both GraphRAG and RAPTOR aim to improve retrieval-augmented generation beyond flat chunk retrieval. How do their underlying indexing structures and retrieval mechanisms differ, and what different
    kinds of queries does each target?
  ground_truth: 'GraphRAG builds an explicit knowledge graph from the source documents, extracting entities and relationships and then partitioning the graph into hierarchical communities, each summarized
    into community reports; at query time it uses these pre-generated community summaries (with a map-reduce style aggregation) to answer global, query-focused summarization questions about an entire corpus.
    RAPTOR instead constructs a recursive tree of clusters: it embeds and clusters text chunks, then recursively summarizes and re-embeds those clusters to build higher-level nodes, so retrieval can traverse
    the tree at multiple abstraction levels. Thus GraphRAG''s structure is graph- and community-based, oriented toward sensemaking over a whole corpus, whereas RAPTOR''s structure is a hierarchical clustering
    tree oriented toward retrieving context at the right granularity for a query. The key contrast is that GraphRAG emphasizes global, corpus-level summarization via community summaries, while RAPTOR emphasizes
    multi-scale retrieval by recursively abstracting clusters of text.'
  gold_evidence:
  - 'GraphRAG uses a large language model (LLM) to build a graph index in two stages: first, an LLM derives an entity knowledge graph from the source documents; second, pre-generated community summaries
    are used to answer questions. Community detection partitions the graph into a hierarchy of communities, and community summaries are generated for each. Given a question, each community summary is used
    to generate a partial response, and these partial responses are aggregated into a final global answer.'
  - RAPTOR recursively clusters and summarizes text chunks to build a tree, where nodes closer to the root contain more abstract summaries and nodes closer to the leaves contain more detailed text. Retrieval
    can then traverse this tree, allowing the model to access information at different levels of abstraction. RAPTOR constructs the tree by clustering the embeddings of text chunks, summarizing each cluster,
    and then recursively embedding, clustering, and summarizing the resulting summaries.
  provenance: llm_synthesized
  source_papers:
  - '2404.16130'
  - '2401.18059'
  source_sections:
  - 2404.16130#(front matter)
  - 2401.18059#(front matter)

    reason: 证据仅说明了 query2doc 的定义与生成伪文档扩展查询的机制，未包含关于 MSMARCO/TREC DL 数据集上 BM25 性能提升 3% 到 15% 且无需微调的实验结果，故该部分事实无证据支撑。
  query_type: single_paper_factual
  id: spf-015
  review_status: approved
  notes: 全文核查 approved

  - '2004.04906'
  question: 开放域问答（Open-domain QA）的两阶段框架由哪两个部分组成？
  ground_truth: 开放域问答采用简化的两阶段框架：第一阶段是上下文检索器（retriever），它先选出少量可能包含答案的段落；第二阶段是机器阅读器（reader），它仔细检查检索到的上下文并找出正确答案。
  gold_evidence:
  - 'a much simplified two-stage framework: (1) a context _retriever_ first selects a small subset of passages where some of them contain the answer to the question, and then (2) a machine _reader_ can
    thoroughly examine the retrieved contexts and identify the correct answer'
  provenance: extractive
  source_papers:
  - '2004.04906'
  source_sections:
  - 2004.04906#(front matter)
  expected_intent: simple_faq
  expected_behavior: answer
  audit:
    section: (front matter)
  verification:
    supported: true
    reason: 证据明确描述了简化的两阶段框架：上下文检索器（retriever）先选出少量可能包含答案的段落，机器阅读器（reader）再检查检索到的上下文并找出正确答案，与声称的基准事实完全一致。
  query_type: single_paper_factual
  id: spf-016
  review_status: approved
  notes: ''

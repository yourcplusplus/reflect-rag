  - '2401.15884'
  question: According to the passage, why do large language models inevitably manifest hallucinations?
  ground_truth: LLMs inevitably manifest hallucinations due to their struggle with factual errors and their inability to secure the accuracy of generated texts solely by the parametric knowledge they encapsulate.
    This is illustrated by examples where a low-quality retriever introduces irrelevant information that impedes generators from acquiring accurate knowledge.
  gold_evidence:
  - Nevertheless, LLMs inevitably manifest hallucinations (Ji et al., 2023) due to their struggle with factual errors (Mallen et al., 2023; Min et al., 2023) and inability to secure the accuracy of generated
    texts solely by the parametric knowledge they encapsulate (Zhang et al., 2023b; Muhlgay et al., 2023).
  provenance: extractive
  source_papers:
  - '2401.15884'
  source_sections:
  - 2401.15884#(front matter)
  expected_intent: simple_faq
  expected_behavior: answer
  audit:
    section: (front matter)
  verification:
    supported: false
    reason: The evidence states the two causes (struggle with factual errors and inability to secure accuracy from parametric knowledge alone), but it does not contain the illustrative example about a low-quality
      retriever introducing irrelevant information, so that part of the ground truth is unsupported.
  query_type: single_paper_factual
  id: spf-001
  review_status: approved
  notes: 全文核查 approved

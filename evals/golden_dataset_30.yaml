- _key:
  - single_paper_factual
  - '2212.03533'
  question: E5 是什么？它是如何训练的？
  ground_truth: E5 是一个在广泛任务上迁移效果良好的最先进文本嵌入模型家族。它采用对比学习方式训练，弱监督信号来自作者整理的大规模文本对数据集 CCPairs。E5 可直接作为通用嵌入模型用于检索、聚类和分类等需要文本单向量表示的任务。
  gold_evidence:
  - This paper presents E5<sup>1</sup> , a family of state-of-the-art text embeddings that transfer well to a wide range of tasks. The model is trained in a contrastive manner with weak supervision signals
    from our curated large-scale text pair dataset (called CCPairs). E5 can be readily used as a general-purpose embedding model for any tasks requiring a single-vector representation of texts such as retrieval,
    clustering, and classification, achieving strong performance in both zero-shot and fine-tuned settings.
  provenance: extractive
  source_papers:
  - '2212.03533'
  source_sections:
  - 2212.03533#(front matter)
  expected_intent: simple_faq
  expected_behavior: answer
  audit:
    section: (front matter)
  verification:
    supported: true
    reason: 证据完整覆盖了 ground truth 中 E5 的定义、对比学习训练方式、CCPairs 弱监督信号来源以及通用嵌入模型用途等全部事实。
  query_type: single_paper_factual
  id: spf-003
  review_status: approved
  notes: ''
- _key:
  - single_paper_factual
  - '2410.05779'
  question: LightRAG 通过什么方式提升信息检索的效率与理解能力？
  ground_truth: LightRAG 通过整合基于图的索引方法来提升信息检索的效率与理解能力。它利用一个全面的知识图谱来促进快速且相关的文档检索，从而能够更深入地理解复杂查询。其双层检索范式可以同时提取具体信息和抽象信息，以满足多样化的用户需求。
  gold_evidence:
  - This work introduces an advancement in Retrieval-Augmented Generation (RAG) through the integration of a graph-based indexing approach that enhances both efficiency and comprehension in information
    retrieval. LightRAG utilizes a comprehensive knowledge graph to facilitate rapid and relevant document retrieval, enabling a deeper understanding of complex queries. Its dual-level retrieval paradigm
    allows for the extraction of both specific and abstract information, catering to diverse user needs.
  provenance: extractive
  source_papers:
  - '2410.05779'
  source_sections:
  - 2410.05779#(front matter)
  expected_intent: single_hop
  expected_behavior: answer
  audit:
    section: (front matter)
  verification:
    supported: true
    reason: 证据逐句对应地说明了基于图的索引方法、全面知识图谱、双层检索范式及满足多样化需求，完整支撑了声明中的全部事实。
  query_type: single_paper_factual
  id: spf-004
  review_status: approved
  notes: ''

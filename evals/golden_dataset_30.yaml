- _key:
  - single_paper_factual
  - '2212.10496'
  question: What is dense retrieval, and what methods have been proposed to improve the effectiveness of supervised dense retrieval models?
  ground_truth: Dense retrieval is the method of retrieving documents using semantic embedding similarities, and it has been shown successful across tasks like web search, question answering, and fact verification.
    To improve the effectiveness of supervised dense retrieval models, a variety of methods have been proposed, such as negative mining, distillation, and task-specific pre-training.
  gold_evidence:
  - Dense retrieval (Lee et al., 2019; Karpukhin et al., 2020), the method of retrieving documents using semantic embedding similarities, has been shown successful across tasks like web search, question
    answering, and fact verification. A variety of methods such as negative mining (Xiong et al., 2021; Qu et al., 2021), distillation (Qu et al., 2021; Lin et al., 2021b; Hofstätter et al., 2021) and task-specific
    pre-training (Izacard et al., 2021; Gao and Callan, 2021; Lu et al., 2021; Gao and Callan, 2022; Liu and Shao, 2022) have been proposed to improve the effectiveness of supervised dense retrieval models.
  provenance: extractive
  source_papers:
  - '2212.10496'
  source_sections:
  - 2212.10496#(front matter)
  expected_intent: simple_faq
  expected_behavior: answer
  audit:
    section: (front matter)
  verification:
    supported: true
    reason: The evidence defines dense retrieval as retrieving documents using semantic embedding similarities, notes its success across web search, question answering, and fact verification, and lists
      negative mining, distillation, and task-specific pre-training as methods to improve supervised dense retrieval models, matching the ground truth.
  query_type: single_paper_factual
  id: spf-014
  review_status: approved
  notes: ''
- _key:
  - single_paper_factual
  - '2303.07678'
  question: query2doc 是什么？它是如何提升检索系统性能的？
  ground_truth: query2doc 是一种简单而有效的查询扩展方法，用于改进稀疏和稠密检索系统。它首先通过少样本提示大语言模型（LLMs）生成伪文档，然后用生成的伪文档扩展查询。实验结果表明，query2doc 在 MSMARCO 和 TREC DL 等 ad-hoc IR 数据集上无需任何模型微调即可将 BM25 的性能提升 3% 到 15%。
  gold_evidence:
  - This paper introduces a simple yet effective query expansion approach, denoted as _query2doc_ , to improve both sparse and dense retrieval systems. The proposed method first generates pseudo-documents
    by few-shot prompting large language models (LLMs), and then expands the query with generated pseudodocuments.
  provenance: extractive
  source_papers:
  - '2303.07678'
  source_sections:
  - 2303.07678#(front matter)
  expected_intent: simple_faq
  expected_behavior: answer
  audit:
    section: (front matter)
  verification:

  question: Both ReAct and ToolLLaMA aim to make LLMs better at using external tools/APIs, but they address the problem from different angles. How do the two works differ in their core approach and in what
    they identify as the key limitation of existing LLMs?
  ground_truth: 'ReAct takes a prompting-based approach: it synergizes reasoning and acting in language models by letting the model generate interleaved reasoning traces and task-specific actions, so that
    reasoning guides action and actions gather observations for further reasoning. ToolLLaMA, by contrast, frames the problem as tool learning and builds a full data-construction-and-training pipeline (API
    collection, instruction generation, solution-path annotation, an API retriever, SFT, and ToolEval) to teach LLMs to interact with real APIs. Their diagnoses of the limitation also differ: ReAct targets
    the gap between pure reasoning and pure acting, whereas ToolLLaMA argues that open-source LLMs lack tool-use sophistication because current instruction tuning focuses on basic language tasks and relatively
    neglects the tool-use domain. Thus ReAct improves tool use through inference-time prompting, while ToolLLaMA improves it through curated tool-use data and supervised fine-tuning.'
  gold_evidence:
  - 'REACT: SYNERGIZING REASONING AND ACTING IN LANGUAGE MODELS'
  - Although open-source LLMs, e.g., LLaMA (Touvron et al., 2023a), have achieved versatile capabilities through instruction tuning (Taori et al., 2023; Chiang et al., 2023), they still lack the sophistication
    in performing higher-level tasks, such as appropriately interacting with tools (APIs) to fulfill complex human instruction. This deficiency is because current instruction tuning largely focuses on basic
    language tasks, with a relative neglect of the tool-use domain.

- id: cpc-026
  question: How do CRAG and RAPTOR differ in the way they address the problem of retrieval quality for retrieval-augmented
    generation?
  query_type: cross_paper_comparison
  ground_truth: 'Both papers start from the premise that retrieval quality determines generation quality: CRAG notes
    that LLMs hallucinate because they cannot secure factual accuracy from parametric knowledge alone, and its Figure
    1 shows a low-quality retriever feeding irrelevant documents that mislead the generator. However, their remedies
    operate at different stages of the pipeline. CRAG targets the retrieval output itself, adding a corrective mechanism
    that evaluates retrieved documents and filters or corrects them before generation, so that inaccurate documents
    do not reach the generator. RAPTOR instead restructures the retrieval corpus, recursively summarizing and abstracting
    documents into a tree organization so that retrieval can draw on multi-level, condensed representations rather
    than flat chunks. Thus CRAG is a corrective/verification layer over retrieval results, whereas RAPTOR is a corpus-organization
    and indexing approach.'
  gold_evidence:
  - 'Figure 1: The examples show that a low-quality retriever is prone to introducing a substantial amount of irrelevant
    information, impeding the generators from acquiring accurate knowledge and potentially misleading them.'

  question: HyDE (Paper A) deliberately avoids training or fine-tuning any model and relies on a zero-shot, label-free
    pipeline to improve dense retrieval. Given that design choice, what specific capability gap does M3-Embedding
    (Paper B) claim to fill, and why can M3-Embedding's approach not be considered a direct substitute for HyDE's
    zero-shot setting?
  ground_truth: HyDE's core conclusion is that precise dense retrieval can be achieved without relevance labels
    and without training or fine-tuning any model, making it a purely zero-shot, inference-time method. M3-Embedding,
    by contrast, addresses versatility across languages, retrieval functionalities, and granularities, but it does
    so through an effective training recipe—notably self-knowledge distillation that integrates relevance scores
    from different retrieval functionalities as teacher signals, plus an optimized batching strategy for large batch
    sizes. Therefore M3-Embedding is a supervised/trained embedding model that improves embedding discriminativeness,
    whereas HyDE explicitly requires no training. Because M3-Embedding's gains depend on a training procedure and
    teacher signals, it cannot directly substitute for HyDE's label-free, training-free zero-shot retrieval setting;
    the two operate under fundamentally different assumptions about supervision.

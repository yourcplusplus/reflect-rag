  question: RAPTOR 是什么？它如何构建层次化的树结构？
  ground_truth: RAPTOR 是一种新颖的基于树的检索系统，它用不同抽象层级的上下文信息来增强大语言模型的参数化知识。它通过递归的聚类和摘要技术，构建出一个能够跨检索语料库各个部分综合信息的层次化树结构。在查询阶段，RAPTOR
    利用该树结构进行更有效的检索。
  gold_evidence:
  - In this paper, we have presented RAPTOR, a novel tree-based retrieval system that augments the parametric knowledge
    of large language models with contextual information at various levels of abstraction. By employing recursive
    clustering and summarization techniques, RAPTOR creates a hierarchical tree structure that is capable of synthesizing
    information across various sections of the retrieval corpora.
  provenance: extractive

  - '2208.03299'
  question: How do RAG and Atlas differ in their target setting and the way they combine retrieval with generation,
    and what does each report about performance relative to large parametric models?
  ground_truth: Both papers address knowledge-intensive NLP tasks by augmenting a language model with a retrieval
    component, but they target different regimes and emphasize different mechanisms. RAG (Paper A) is presented
    as a general-purpose approach for knowledge-intensive tasks, pairing a parametric seq2seq generator with a non-parametric
    dense index accessed via a retriever, so that knowledge can be updated by swapping the index rather than the
    parameters. Atlas (Paper B) instead focuses explicitly on the few-shot setting, arguing that retrieval-augmented
    models can excel at knowledge-intensive tasks without needing massive parameter counts to store knowledge, and
    it is carefully designed and pre-trained for learning such tasks from very few examples. Atlas also studies
    the impact of the content of the document index, showing it can easily be updated, echoing RAG's non-parametric
    knowledge idea. In terms of results, Atlas reaches over 42% accuracy on Natural Questions with only 64 examples,
    outperforming a 540B-parameter model by 3% despite having 50x fewer parameters, which directly supports the
    claim that retrieval augmentation substitutes for parameter-heavy knowledge storage.
  gold_evidence:
  - 'Retrieval-Augmented Generation (RAG) models combine parametric and non-parametric memory for language generation:
    a parametric seq2seq model acts as the generator and a dense vector index of Wikipedia, accessed by a neural
    retriever, provides non-parametric memory. We fine-tune and evaluate our models on a wide range of knowledge-intensive
    NLP tasks and set the state of the art on three open domain QA tasks, outperforming parametric seq2seq models
    and task-specific retrieve-and-extract architectures. For generation tasks, we find that RAG models generate
    more specific, diverse and factual language than a state-of-the-art parametric-only seq2seq baseline.'
  - Retrieval augmented models are known to excel at knowledge intensive tasks without the need for as many parameters,
    but it is unclear whether they work in few-shot settings. In this work we present Atlas, a carefully designed
    and pre-trained retrieval augmented language model able to learn knowledge intensive tasks with very few training
    examples. We perform evaluations on a wide range of tasks, including MMLU, KILT and NaturalQuestions, and study
    the impact of the content of the document index, showing that it can easily be updated. Notably, Atlas reaches
    over 42% accuracy on Natural Questions using only 64 examples, outperforming a 540B parameters model by 3% despite
    having 50x fewer parameters.
  provenance: llm_synthesized
  source_papers:

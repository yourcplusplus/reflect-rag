    technical contributions such as a self-knowledge distillation approach that integrates relevance scores from
    different retrieval functionalities as teacher signals, plus an optimized batching strategy for large batch
    sizes and high throughput. Thus Query2doc is a training-free, query-expansion wrapper applicable to existing

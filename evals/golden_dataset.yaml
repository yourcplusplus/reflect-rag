  question: Paper A (E5) claims to be the first model to beat BM25 on BEIR zero-shot without labeled data, and it
    is offered as a general-purpose single-vector embedding model. Paper B (RAG-Fusion) builds its retrieval pipeline
    on top of a RAG chatbot but never specifies which embedding/retriever it uses, and reports that some answers
    "strayed off topic when the generated queries' relevance to the original query is insufficient." Given A's conclusion
    that a single-vector embedding can serve as a general-purpose retriever that outperforms BM25 zero-shot, how
    should we interpret B's off-topic failure — is it a limitation of the underlying embedding/retrieval model (as
    A would frame it) or of the query-generation/fusion stage (as B frames it), and what does this imply about whether
    B's RAG-Fusion gains are attributable to better retrieval or to better query expansion?
  query_type: cross_paper_multi_hop
  ground_truth: 'A establishes that a single-vector embedding model (E5), trained with weakly-supervised contrastive
    pre-training, can act as a general-purpose retriever and is the first to beat BM25 on BEIR zero-shot without
    labeled data — meaning the retrieval backbone itself is not the bottleneck in a well-built pipeline. B reports
    that RAG-Fusion''s failures occur when generated queries are insufficiently relevant to the original query,
    i.e., the failure is localized to the query-generation/fusion stage rather than to the retriever. Read together,
    B''s off-topic answers cannot be blamed on a weak embedding/retrieval model of the kind A describes; instead
    they point to the multi-query expansion step injecting semantic drift. Consequently, B''s reported accuracy/comprehensiveness
    gains are more plausibly attributable to query expansion and RRF fusion (better recall/coverage of the query
    space) than to any improvement in the underlying single-vector retrieval quality, which A already shows can
    be strong zero-shot. This also exposes a gap: B never specifies its embedding model, so its results cannot be
    cleanly separated from retrieval quality versus fusion quality — a confound that A''s framing makes salient.'
  gold_evidence:
  - '"For zero-shot settings, E5 is the first model that outperforms the strong BM25 baseline on the BEIR retrieval
    benchmark without using any labeled data." / "E5 can be readily used as a general-purpose embedding model for
    any tasks requiring a single-vector representation of texts such as retrieval, clustering, and classification,
    achieving strong performance in both zero-shot and fine-tuned settings."'
  - '"I found that RAG-Fusion was able to provide accurate and comprehensive answers due to the generated queries
    contextualizing the original query from various perspectives. However, some answers strayed off topic when the
    generated queries'' relevance to the original query is insufficient."'
  provenance: llm_synthesized

  question: ColBERT's late-interaction design was motivated by the need to make BERT-based ranking efficient enough
    for large-scale retrieval, yet it still relies on a fixed, single-query retrieval stage. How does RAG-Fusion's
    query-generation and reciprocal-rank-fusion mechanism address the query-side limitation that ColBERT's late-interaction
    architecture leaves untouched, and what new failure mode does RAG-Fusion introduce that ColBERT's single-query
    paradigm does not have to worry about?
  ground_truth: 'ColBERT''s contribution is architectural: it keeps BERT''s contextualized query–document interaction
    but decomposes it into cheap, pre-computable MaxSim operations, so it improves the efficiency and effectiveness
    of scoring a single query against a corpus rather than changing how the query itself is formed. Its late-interaction
    paradigm therefore leaves the query-side bottleneck open: retrieval quality is still bounded by one fixed query
    representation, and ColBERT offers no mechanism to reformulate or diversify the query. RAG-Fusion targets exactly
    this gap by generating multiple queries that contextualize the original query from various perspectives, then
    reranking and fusing the resulting documents with reciprocal rank fusion, which yields answers judged more accurate
    and comprehensive. However, this multi-query expansion introduces a failure mode absent from ColBERT''s single-query
    setting: when the generated queries'' relevance to the original query is insufficient, the answers stray off
    topic. Thus RAG-Fusion trades ColBERT''s query-side rigidity for a new risk of query drift.'
  gold_evidence:
  - ColBERT introduces a late interaction architecture that adapts BERT to efficient and effective passage search,
    retaining BERT's deep contextualized query–document interaction while enabling offline pre-computation of document
    representations and cheap MaxSim scoring at query time.
  - RAG-Fusion combines RAG and reciprocal rank fusion (RRF) by generating multiple queries, reranking them with
    reciprocal scores and fusing the documents and scores... RAG-Fusion was able to provide accurate and comprehensive
    answers due to the generated queries contextualizing the original query from various perspectives. However,
    some answers strayed off topic when the generated queries' relevance to the original query is insufficient.
  provenance: llm_synthesized

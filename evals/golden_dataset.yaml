  question: How do Atlas and ToolLLaMA differ in the way they augment a language model with external resources,
    and what problem does each approach aim to solve?
  ground_truth: 'Atlas augments a language model with a retrieval component over a document index, aiming to handle
    knowledge-intensive tasks such as question answering and fact checking in few-shot settings without needing
    massive parameter counts; its index can be easily updated, and it reaches over 42% accuracy on Natural Questions
    with only 64 examples, beating a 540B-parameter model by 3% despite having 50x fewer parameters. ToolLLaMA instead
    augments an LLM with tools/APIs, aiming to let the model act as an intermediary between users and applications
    by interacting with APIs to accomplish complex tasks. The motivation differs: Atlas addresses the need for large
    parameter counts to store knowledge, whereas ToolLLaMA addresses the deficiency of open-source LLMs in tool-use,
    since current instruction tuning focuses on basic language tasks and neglects the tool-use domain. Thus Atlas
    retrieves documents to supply knowledge, while ToolLLaMA retrieves APIs and generates solution paths to supply
    actions.'
  gold_evidence:
  - Retrieval augmented models are known to excel at knowledge intensive tasks without the need for as many parameters,
    but it is unclear whether they work in few-shot settings. In this work we present Atlas, a carefully designed
    and pre-trained retrieval augmented language model able to learn knowledge intensive tasks with very few training
    examples. ... Notably, Atlas reaches over 42% accuracy on Natural Questions using only 64 examples, outperforming
    a 540B parameters model by 3% despite having 50x fewer parameters.
  - Tool learning (Qin et al., 2023b) aims to unleash the power of large language models (LLMs) to effectively interact
    with various tools (APIs) to accomplish complex tasks. ... Although open-source LLMs, e.g., LLaMA (Touvron et
    al., 2023a), have achieved versatile capabilities through instruction tuning (Taori et al., 2023; Chiang et
    al., 2023), they still lack the sophistication in performing higher-level tasks, such as appropriately interacting
    with tools (APIs) to fulfill complex human instruction. This deficiency is because current instruction tuning
    largely focuses on basic language tasks, with a relative neglect of the tool-use domain.
  provenance: llm_synthesized

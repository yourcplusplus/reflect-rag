  question: Matryoshka Representation Learning (Paper A) reports that its flexible-size representations are competitive
    with fixed-size baselines and even suggests studying the trade-off between representation size and encoded biases,
    but it does not address whether a language model can autonomously decide when to invoke an external capability.
    How does Toolformer (Paper B) address the gap that MRL leaves open, and why does Toolformer's self-supervised
    API-calling mechanism represent a different solution to the same underlying problem of "getting the best of
    both worlds" that MRL pursues through nested representations?
  ground_truth: MRL (Paper A) leaves open the question of how a model can adaptively choose the right representation
    size/capability at inference time; it only shows that nested representations can be trained and that smaller
    sizes remain competitive, and it explicitly flags the size-vs-bias trade-off as future work rather than solving
    adaptive selection. Toolformer (Paper B) addresses this by training an LM to decide which APIs to call, when,
    with what arguments, and how to incorporate results, all in a self-supervised way requiring only a handful of
    demonstrations per API. Both papers pursue a "best of both worlds" goal — MRL by making one model serve many
    representation budgets, Toolformer by letting one LM combine its own language abilities with external tools
    for arithmetic, lookup, translation, etc. The key difference is that MRL's flexibility is baked into the representation
    geometry (nested subspaces), whereas Toolformer's flexibility is learned as a decision policy over external
    tool calls, so Toolformer solves the adaptive-selection problem that MRL's conclusion leaves unaddressed.
  gold_evidence:
  - '"However, a study on the trade-off between representation size and the tendency to encode biases is an interesting
    future direction along the lines of existing literature [36, 37]. A part of this is already presented in Section
    5."'
  - '"We introduce Toolformer, a model trained to decide which APIs to call, when to call them, what arguments to
    pass, and how to best incorporate the results into future token prediction. This is done in a self-supervised
    way, requiring nothing more than a handful of demonstrations for each API."'
  provenance: llm_synthesized

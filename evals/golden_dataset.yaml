    a late-interaction architecture, but like other dense retrieval models it relies on supervised relevance labels
    and task-specific training to be effective. HyDE addresses this by generating a hypothetical document from the
    query using an instruction-following language model, then encoding that synthetic document into an embedding
    for retrieval—without any relevance labels or model fine-tuning. This matters because it removes the dependency
    on labeled data and task-specific training that ColBERT-style models require, enabling precise zero-shot dense
    retrieval. Thus HyDE can be seen as directly tackling the supervision bottleneck that ColBERT's approach leaves
    unaddressed.

    pair dataset called CCPairs, and it is designed as a general-purpose single-vector embedding model for tasks
    such as retrieval, clustering, and classification. M3-Embedding instead relies on a novel self-knowledge distillation
    approach, where relevance scores from different retrieval functionalities are integrated as a teacher signal
    to improve training quality, combined with an optimized batching strategy for large batch sizes. In terms of

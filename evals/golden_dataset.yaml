  question: ReAct 这篇论文的核心思想是什么？
  ground_truth: ReAct 提出了一种让语言模型在交错进行的推理轨迹与任务特定动作之间协同工作的通用范式。在该范式中，推理轨迹帮助模型归纳、追踪和更新行动计划，并处理异常情况；而动作则使模型能够与外部环境（如知识库或环境）交互并收集额外信息。该方法在语言理解和交互式决策任务上都取得了优于单纯推理或单纯行动基线的效果。
  gold_evidence:
  - 'We explore the use of large language models (LLMs) to generate both reasoning traces and task-specific actions
    in an interleaved manner, allowing for greater synergy between the two: reasoning traces help the model induce,
    track, and update action plans as well as handle exceptions, while actions allow it to interface with external
    sources, such as knowledge bases or environments, to gather additional information.'
  provenance: extractive
  source_papers:

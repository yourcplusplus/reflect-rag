  - '2310.11511'
  question: How do CRAG and Self-RAG differ in the way they address the problem of low-quality or irrelevant retrieved
    documents in retrieval-augmented generation?
  ground_truth: 'Both papers target the same weakness of retrieval-augmented generation: a low-quality retriever
    can inject irrelevant information that misleads the generator. CRAG frames this as a retrieval-quality problem,
    noting that a poor retriever is "prone to introducing a substantial amount of irrelevant information," and therefore
    applies a corrective step to the retrieved documents before generation. Self-RAG instead places the critique
    inside the model itself, training the LLM to retrieve, generate, and critique through self-reflection, so that
    it decides when and what to retrieve and evaluates its own output. Thus CRAG corrects retrieval externally,
    whereas Self-RAG internalizes retrieval and critique decisions in the generator. Both ultimately aim to keep
    the generator from being misled by inaccurate documents, but they intervene at different stages of the pipeline.'
  gold_evidence:
  - 'Figure 1: The examples show that a low-quality retriever is prone to introducing a substantial amount of irrelevant
    information, impeding the generators from acquiring accurate knowledge and potentially misleading them.'
  - 'SELF-RAG: LEARNING TO RETRIEVE, GENERATE, AND CRITIQUE THROUGH SELF-REFLECTION'

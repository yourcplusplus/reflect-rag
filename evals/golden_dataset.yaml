  question: RETRO (Paper A) improves language models by retrieving from trillions of tokens, yet it still relies
    on a single forward pass to produce its output. Given that limitation, how does SELF-REFINE (Paper B) offer
    a complementary way to improve an LLM's output at test time, and what does SELF-REFINE's evaluation show about
    whether even a strong retrieval-augmented or state-of-the-art LLM's first-pass output is optimal?
  ground_truth: RETRO augments a language model with a massive retrieval database (trillions of tokens) to improve
    its predictions, but it still generates output in a single forward pass and does not iteratively revise that
    output. SELF-REFINE addresses exactly this gap by having the same LLM generate an initial output, then provide
    feedback on it and refine itself iteratively, without any supervised training data, additional training, or
    reinforcement learning. Evaluated across 7 diverse tasks (from dialog response generation to mathematical reasoning)
    with GPT-3.5 and GPT-4, SELF-REFINE outputs are preferred by humans and automatic metrics over conventional
    one-step generation, improving task performance by ~20% absolute on average. This shows that even state-of-the-art
    LLMs do not produce their best output on the first try, so test-time iterative refinement is a complementary
    improvement axis to RETRO's retrieval-based scaling.
  gold_evidence:
  - RETRO (Paper A) improves language models by retrieving from trillions of tokens, enhancing predictions via a
    massive retrieval database, but it produces its output in a single forward pass without any iterative refinement
    of that output.
  - '"Like humans, large language models (LLMs) do not always generate the best output on their first try... SELF-REFINE
    does not require any supervised training data, additional training, or reinforcement learning... Across all
    evaluated tasks, outputs generated with SELF-REFINE are preferred by humans and automatic metrics over those
    generated with the same LLM using conventional one-step generation, improving by ∼20% absolute on average in
    task performance."'

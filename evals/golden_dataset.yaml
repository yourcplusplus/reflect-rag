  question: Query2doc and RAPTOR both use LLMs to improve retrieval, but they intervene at different stages of the
    pipeline. How do the two approaches differ in terms of what they generate and how that generated content is
    used by the retriever?
  ground_truth: 'Query2doc intervenes on the query side: it uses few-shot prompting of LLMs to generate pseudo-documents,
    then expands the original query with these generated pseudo-documents so that the retriever (sparse or dense)
    sees a richer query containing relevant, disambiguating information. RAPTOR instead intervenes on the corpus/index
    side, recursively and abstractively processing documents to build a tree-organized retrieval structure. Thus
    Query2doc''s LLM output is consumed as extra query text at retrieval time, whereas RAPTOR''s LLM-generated abstractions
    are embedded into the index hierarchy itself. Both exploit LLM knowledge to bridge the gap between short queries
    and relevant content, but Query2doc requires no model fine-tuning and boosts BM25 by 3%–15% on datasets like
    MSMARCO and TREC DL, while RAPTOR restructures how documents are represented and retrieved.'
  gold_evidence:
  - The proposed method first generates pseudo-documents by few-shot prompting large language models (LLMs), and
    then expands the query with generated pseudodocuments. LLMs are trained on web-scale text corpora and are adept
    at knowledge memorization. The pseudo-documents from LLMs often contain highly relevant information that can
    aid in query disambiguation and guide the retrievers. Experimental results demonstrate that query2doc boosts
    the performance of BM25 by 3% to 15% on ad-hoc IR datasets, such as MSMARCO and TREC DL, without any model fine-tuning.
  - 'RAPTOR: RECURSIVE ABSTRACTIVE PROCESSING FOR TREE-ORGANIZED RETRIEVAL'

    Agent 的手脚"这一要素，即模型与外部世界接口的动作空间。但 Toolformer 的调用是单步、无状态的：它在生成文本时即时插入一次 API 结果并继续预测，并不存在"观察空间—动作空间"的持续交互，也没有 ReAct

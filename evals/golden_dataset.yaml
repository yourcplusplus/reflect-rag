    because it only retrieves local, top-k text chunks and cannot aggregate information across the whole corpus;
    its solution builds a hierarchical entity graph with community summaries, but this requires expensive LLM-based
    community detection and summarization over the entire graph, which is costly and slow to update. Paper B's LightRAG
    addresses exactly this open problem by combining graph structures with a dual-level retrieval paradigm (low-level
    for specific entities, high-level for broad themes), which captures both local and global information while
    avoiding the heavy community-summarization pipeline. Thus LightRAG is positioned as a more efficient, scalable
    alternative that preserves GraphRAG's global-awareness advantage at lower cost.

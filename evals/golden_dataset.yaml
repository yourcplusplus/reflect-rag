  - '2303.17651'
  question: SELF-REFINE 是什么？它的主要思想是什么？
  ground_truth: SELF-REFINE 是一种通过迭代反馈与改进来提升大语言模型初始输出的方法。其核心思想是先用 LLM 生成一个初始输出，然后由同一个 LLM 为其输出提供反馈，并据此迭代地改进自身。它不需要任何监督训练数据、额外训练或强化学习，而是使用单个
    LLM 同时充当生成器、改进器和反馈提供者。
  gold_evidence:
  - Motivated by how humans refine their written text, we introduce SELF-REFINE, an approach for improving initial
    outputs from LLMs through iterative feedback and refinement. The main idea is to generate an initial output
    using an LLM; then, the same LLM provides _feedback_ for its output and uses it to _refine_ itself, iteratively.
    SELF-REFINE does not require any supervised training data, additional training, or reinforcement learning, and
    instead uses a single LLM as the generator, refiner and the feedback provider.
  provenance: extractive
  source_papers:
  - '2303.17651'
  source_sections:
  - 2303.17651#(front matter)
  expected_intent: simple_faq
  expected_behavior: answer

  question: Paper A concludes that RAG-Fusion's generated queries can cause answers to stray off topic when those
    queries' relevance to the original query is insufficient. How does Paper B's framing of a modern Agent as "LLM
    + 上下文 + 工具" with a ReAct loop and "Harness 工程" reframe this failure — i.e., is the off-topic drift a flaw of
    the LLM itself or of the surrounding harness/context engineering, and what does that imply for fixing RAG-Fusion?
  ground_truth: 'Paper A''s evaluation shows RAG-Fusion improves accuracy and comprehensiveness because generated
    queries contextualize the original query from multiple perspectives, but it fails when those generated queries
    are insufficiently relevant to the original query, causing answers to stray off topic. Paper B reframes such
    failures by defining a modern Agent as LLM + 上下文 + 工具, where the LLM is only the "brain" while context is the
    "eyes" and tools are the "hands," and by emphasizing Harness 工程 (the engineering around the model) as the real
    source of competitiveness, evolving from prompt engineering to loop engineering. Read together, RAG-Fusion''s
    off-topic drift is not primarily an LLM capability failure but a context/harness failure: the query-generation
    and RRF fusion step is part of the harness that shapes the agent''s observation space, so the fix is to engineer
    that loop (e.g., constrain or verify generated-query relevance) rather than to swap in a stronger LLM. This
    means Paper A''s limitation is addressable at the harness level, which Paper B treats as the locus of competitive
    advantage.'

  question: How do the two papers position themselves differently with respect to the role of supervised training
    in dense retrieval for open-domain QA?
  ground_truth: Paper A (DPR) frames open-domain QA as a two-stage retrieve-then-read pipeline and argues that the
    bottleneck lies in the retriever, since a machine reader's exact match on SQuAD v1.1 collapses from above 80%
    to less than 40% when applied to retrieved contexts; its contribution is therefore a trained dense retriever.
    Paper B (HyDE) instead takes supervised dense retrieval as an already established success and lists the techniques
    used to improve it—negative mining, distillation, and task-specific pre-training—while explicitly noting that
    no models were trained or fine-tuned in producing its work. Thus, whereas Paper A improves retrieval by training
    a dense encoder, Paper B aims at precise zero-shot dense retrieval without relevance labels and without any
    training.
  gold_evidence:
  - Although reducing open-domain QA to machine reading is a very reasonable strategy, a huge performance degradation
    is often observed in practice, indicating the needs of improving retrieval. ... the exact match score on SQuAD
    v1.1 drops from above 80% to less than 40%
  - Dense retrieval (Lee et al., 2019; Karpukhin et al., 2020), the method of retrieving documents using semantic
    embedding similarities, has been shown successful across tasks like web search, question answering, and fact
    verification. A variety of methods such as negative mining (Xiong et al., 2021; Qu et al., 2021), distillation
    (Qu et al., 2021; Lin et al., 2021b; Hofstätter et al., 2021) and task-specific pre-training ... have been proposed
    to improve the effectiveness of supervised dense retrieval models. ... No models were trained or fine-tuned
    in making this preprint.

    and refining its own output, with no supervised data, extra training, or reinforcement learning, and reports
    ~20% absolute average gains across 7 tasks with GPT-3.5/GPT-4. Read together, SELF-REFINE suggests that the
    external-tool grounding ReAct relies on is not strictly necessary for test-time gains, meaning the two approaches

  question: How do REALM and Corrective Retrieval Augmented Generation (CRAG) differ in their treatment of the retriever
    within a retrieval-augmented generation pipeline, and what problem does each paper identify as the central motivation
    for its approach?
  ground_truth: 'REALM treats the retriever as a trainable component of language model pre-training: it augments
    pre-training with a neural knowledge retriever over a textual corpus such as Wikipedia, and the language modeling
    objective''s signal is backpropagated all the way through the retriever, which must consider millions of documents—a
    computational challenge the paper explicitly addresses. Its motivation is that pre-trained models like BERT,
    RoBERTa and T5 already store a surprising amount of world knowledge, so retrieval can be learned jointly rather
    than bolted on. CRAG, by contrast, starts from the observation that LLMs inevitably manifest hallucinations
    because they struggle with factual errors and cannot secure accuracy from parametric knowledge alone. It focuses
    on the failure mode of a low-quality retriever, which is prone to introducing substantial irrelevant information,
    impeding generators from acquiring accurate knowledge and potentially misleading them. Thus REALM optimizes
    the retriever end-to-end during pre-training, whereas CRAG diagnoses and corrects retrieval quality at generation
    time.'
  gold_evidence:
  - REALM augments language model pre-training with a neural knowledge retriever that retrieves knowledge from a
    textual knowledge corpus, Z (e.g., all of Wikipedia). Signal from the language modeling objective backpropagates
    all the way through the retriever, which must consider millions of documents in Z—a significant computational
    challenge that we address.
  - The examples show that a low-quality retriever is prone to introducing a substantial amount of irrelevant information,
    impeding the generators from acquiring accurate knowledge and potentially misleading them.
  provenance: llm_synthesized
  source_papers:
  - '2002.08909'

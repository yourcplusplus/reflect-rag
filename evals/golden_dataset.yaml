  question: Both SELF-RAG and ReAct interleave reasoning with retrieval/acting, but how do their mechanisms for
    deciding when to retrieve or act differ, and what distinct capabilities does each approach claim as a result?
  ground_truth: SELF-RAG trains an LM to adaptively retrieve passages on demand and to generate self-reflection
    tokens that critique its own output, using special tokens such as "Retrieve" and "Critique" to control retrieval
    and assess relevance, support, and usefulness. ReAct instead prompts an LLM to interleave verbal reasoning traces
    with task-specific actions in an alternating manner, where the reasoning traces help the model induce, track,
    and update action plans while handling exceptions. Thus SELF-RAG's control is learned and internalized through
    training with reflection tokens, whereas ReAct's is elicited through prompting that produces thought-action-observation
    trajectories. As a result, SELF-RAG claims improved factuality and citation accuracy on tasks like open-domain
    QA and long-form generation, while ReAct claims improved synergies between reasoning and acting that reduce
    hallucination and error propagation on knowledge-intensive and interactive decision-making benchmarks.
  gold_evidence:
  - We introduce Self-RAG, a framework to enhance an LM's generation quality and factuality through retrieval and
    self-reflection. Self-RAG trains an arbitrary LM to adaptively retrieve passages on-demand and generate and
    reflect on retrieved passages and its own generations using special tokens, called reflection tokens. Generating
    reflection tokens makes the LM controllable during the inference phase, enabling it to tailor its behavior to
    diverse task requirements.
  - We explore the use of LLMs to synergize reasoning and acting in an interleaved manner to solve diverse language
    reasoning and decision making tasks. ReAct prompts LLMs to generate both verbal reasoning traces and actions
    pertaining to a task in an interleaved manner, which allows the model to perform dynamic reasoning to create,
    maintain, and adjust high-level plans for acting (reason to act), while also interact with the external environments
    (e.g., Wikipedia) to incorporate additional information into reasoning (acting to reason).

  question: RETRO (Paper A) scales retrieval to trillions of tokens via a frozen BERT-embedding nearest-neighbour
    index and shows large perplexity gains, yet it keeps the retrieval mechanism fixed and non-differentiable. How
    does Toolformer (Paper B) address the specific limitation that RETRO's retrieval is a static, hand-designed
    component that the LM cannot itself decide when or how to invoke?
  ground_truth: 'RETRO demonstrates that conditioning an LM on retrieved chunks from a trillion-token datastore
    yields substantial gains, but its retrieval is a fixed, non-differentiable nearest-neighbour lookup over frozen
    BERT embeddings—the model never learns when retrieval is useful or how to integrate it. Toolformer addresses
    exactly this gap by making tool/API invocation a learned, self-supervised decision: the LM itself decides which
    API to call, when, with what arguments, and how to fold the result into future token prediction, using only
    a handful of demonstrations per API. Thus where RETRO supplies a static retrieval module, Toolformer turns external
    access (calculator, QA, search, translation, calendar) into an LM-controlled action, improving zero-shot performance
    without sacrificing core language modeling.'
  gold_evidence:
  - RETRO combines a 2 trillion token database with a retrieval-enhanced autoregressive language model, using a
    frozen BERT-embedded nearest-neighbour index; the retrieval is a fixed, non-differentiable component rather
    than something the model learns to control.
  - We introduce Toolformer, a model trained to decide which APIs to call, when to call them, what arguments to
    pass, and how to best incorporate the results into future token prediction. This is done in a self-supervised
    way, requiring nothing more than a handful of demonstrations for each API.

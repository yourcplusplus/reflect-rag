  question: Toolformer shows that an LM can teach itself to call external tools (e.g., a search engine or Q&A API)
    and fold the returned results into its own token predictions, achieving strong zero-shot gains without losing
    language-modeling ability. Query2doc, by contrast, never calls any tool at inference time — it only uses an
    LLM's own generated text to expand queries. Given Toolformer's demonstration that tool/API outputs can be injected
    into a model's context to improve downstream predictions, how should we interpret Query2doc's claim that LLM-generated
    pseudo-documents "contain highly relevant information that can aid in query disambiguation," and what does this
    comparison reveal about the source of Query2doc's gains?
  ground_truth: Toolformer establishes that an LM can be trained to decide when to invoke an external API and to
    incorporate the returned result (e.g., a search-engine or Q&A answer) directly into its context to improve subsequent
    token prediction, so external, retrieved information is a proven source of downstream gains. Query2doc does
    not invoke any such API; it instead relies solely on the LLM's own few-shot-generated pseudo-documents, which
    it appends to the query to expand it. Read against Toolformer, Query2doc's "highly relevant information" is
    therefore not externally retrieved evidence but internally generated, memorized knowledge — the LLM's parametric
    memory rather than a tool's output. The comparison shows that Query2doc's 3–15% BM25 gains and its improvements
    to dense retrievers come from exploiting the LLM as a knowledge source for query disambiguation, not from any
    tool-use or retrieval-augmentation mechanism of the kind Toolformer validates.
  gold_evidence:
  - We introduce Toolformer, a model trained to decide which APIs to call, when to call them, what arguments to
    pass, and how to best incorporate the results into future token prediction. This is done in a self-supervised
    way... We incorporate a range of tools, including a calculator, a Q&A system, a search engine, a translation
    system, and a calendar. Toolformer achieves substantially improved zero-shot performance across a variety of
    downstream tasks... without sacrificing its core language modeling abilities.
  - The proposed method first generates pseudo-documents by few-shot prompting large language models (LLMs), and
    then expands the query with generated pseudodocuments. LLMs are trained on web-scale text corpora and are adept
    at knowledge memorization. The pseudo-documents from LLMs often contain highly relevant information that can
    aid in query disambiguation and guide the retrievers.

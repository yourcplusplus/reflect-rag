- _key:
  - term_ambiguity
  - search
  question: Does the term "search" carry different meanings across papers 2002.08909, 2004.04906, and 2004.12832?
  ground_truth: '2002.08909: "search" is not used as a standalone technical term; the paper frames retrieval as
    a latent-variable inference problem, where the retriever selects documents z from corpus Z and the marginal
    probability p(y|x) requires summing over all documents, optimized via stochastic gradient descent. 2004.04906:
    "search" refers to efficient similarity/matching over a precomputed index of passage representations, e.g.,
    "inner product search," where the similarity function must be decomposable so passage representations can be
    precomputed (contrasted with sparse TF-IDF/BM25 keyword matching). 2004.12832: "search" (passage search) refers
    to the end-to-end ranking task of scoring query–document pairs with a deep LM (ColBERT''s late interaction),
    emphasizing efficiency of retrieval/ranking. Divergence: the papers use "search" at different levels — 2002.08909
    treats it implicitly as latent-variable document selection within a probabilistic training objective, 2004.04906
    treats it as decomposable vector similarity search over a precomputed index, and 2004.12832 treats it as the
    neural ranking/scoring task itself. These are related but distinct framings rather than a single shared definition.'
  gold_evidence:
  - '2002.08909: retrieval as latent-variable document selection; the retriever picks documents z from corpus Z
    and search is embedded in maximizing log p(y|x) via marginalization over all documents'

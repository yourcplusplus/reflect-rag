  question: Paper A (DPR) frames open-domain QA as a two-stage retrieve-then-read pipeline and shows that the bottleneck
    is the retriever, since exact match collapses from >80% on SQuAD v1.1 to <40% in the open-domain setting. Given
    that diagnosis, how should we interpret Paper B's (RETRO) decision to retrieve from trillions of tokens and
    fuse the retrieved evidence directly into the language model's forward pass, rather than retrieving a small
    set of passages for a separate downstream reader?
  ground_truth: 'DPR''s conclusion is that the two-stage framework''s weakness lies in retrieval quality, not in
    the reader, because the reader degrades sharply (SQuAD EM >80% → <40%) when it must operate over retrieved contexts.
    RETRO can therefore be read as attacking the same diagnosed bottleneck but at a different level: instead of
    improving a small passage retriever to feed a separate reader, it scales retrieval to trillions of tokens and
    conditions the LM itself on retrieved neighbors via chunked cross-attention, so retrieval and generation are
    jointly modeled rather than pipelined. This means RETRO does not simply "fix" DPR''s retriever; it questions
    DPR''s architectural premise that retrieval should be a discrete, small-candidate pre-filtering stage for a
    downstream reader. The two works are complementary in motivation (retrieval is the key lever for knowledge-intensive
    tasks) but divergent in solution: DPR optimizes the retriever within a two-stage pipeline, whereas RETRO dissolves
    the pipeline boundary by making retrieval an intrinsic part of the model.'
  gold_evidence:
  - '"the advances of reading comprehension models suggest a much simplified two-stage framework: (1) a context
    retriever first selects a small subset of passages where some of them contain the answer to the question, and
    then (2) a machine reader can thoroughly examine the retrieved contexts and identify the correct answer... Although
    reducing open-domain QA to machine reading is a very reasonable strategy, a huge performance degradation is
    often observed in practice, indicating the needs of improving retrieval." / "the exact match score on SQuAD
    v1.1 drops from above 80% to less than 40%."'

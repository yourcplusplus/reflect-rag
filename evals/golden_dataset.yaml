  question: How do REALM and RAPTOR differ in the way they obtain and organize the knowledge that supports a language
    model's predictions?
  ground_truth: REALM augments language model pre-training with a neural knowledge retriever that pulls knowledge
    from a textual knowledge corpus such as all of Wikipedia, and the language modeling objective's signal backpropagates
    all the way through the retriever, forcing it to consider millions of documents. RAPTOR, by contrast, is a recursive
    abstractive processing method that builds a tree-organized retrieval structure rather than relying on a flat
    document corpus. Thus, while REALM's key challenge is making retrieval over millions of documents computationally
    tractable during pre-training, RAPTOR's contribution lies in recursively summarizing and organizing content
    into a hierarchy for retrieval. Both approaches aim to supply external knowledge to a language model, but REALM
    learns retrieval end-to-end via pre-training gradients, whereas RAPTOR structures knowledge through recursive
    abstraction into a tree.
  gold_evidence:
  - REALM augments language model pre-training with a neural knowledge retriever that retrieves knowledge from a
    textual knowledge corpus, Z (e.g., all of Wikipedia). Signal from the language modeling objective backpropagates
    all the way through the retriever, which must consider millions of documents in Z—a significant computational
    challenge that we address.

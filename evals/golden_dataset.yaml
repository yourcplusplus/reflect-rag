  question: How do RETRO (Paper A) and Atlas (Paper B) differ in their approach to retrieval-augmented language
    modeling, and what do their reported results suggest about the trade-off between model scale and retrieval?
  ground_truth: 'Both papers pursue retrieval-augmented language modeling but with different emphases: RETRO (Paper
    A) is a DeepMind effort focused on scaling retrieval to trillions of tokens, while Atlas (Paper B) is a carefully
    designed and pre-trained retrieval augmented model explicitly targeting few-shot learning on knowledge-intensive
    tasks. Atlas argues that retrieval augmented models excel at knowledge-intensive tasks without needing as many
    parameters, addressing the concern that massive parameter counts seem necessary to store knowledge for tasks
    like question answering and fact checking. Empirically, Atlas reaches over 42% accuracy on Natural Questions
    using only 64 examples, outperforming a 540B-parameter model by 3% despite having 50x fewer parameters. Together,
    the two works suggest that retrieval can substitute for much of the parameter scale otherwise needed to store
    knowledge, and that this benefit extends even to few-shot settings.'
  gold_evidence:
  - Improving language models by retrieving from trillions of tokens
  - In this work we present Atlas, a carefully designed and pre-trained retrieval augmented language model able
    to learn knowledge intensive tasks with very few training examples. We perform evaluations on a wide range of
    tasks, including MMLU, KILT and NaturalQuestions, and study the impact of the content of the document index,
    showing that it can easily be updated. Notably, Atlas reaches over 42% accuracy on Natural Questions using only
    64 examples, outperforming a 540B parameters model by 3% despite having 50x fewer parameters.

  question: Both papers aim to improve retrieval for downstream tasks, but they intervene at different points in
    the retrieval pipeline. What is the core mechanism each proposes, and how do their reported gains differ in
    nature?
  ground_truth: 'DPR addresses retrieval by training a dense dual-encoder retriever so that a small set of answer-containing
    passages can be selected before a machine reader examines them, motivated by the observation that open-domain
    QA performance collapses when reading comprehension models are applied to retrieved contexts (e.g., SQuAD v1.1
    exact match dropping from above 80% to less than 40%). Query2doc instead leaves the retriever''s architecture
    untouched and intervenes at the query side: it generates pseudo-documents via few-shot prompting of LLMs and
    expands the original query with them, since LLMs'' web-scale training makes the pseudo-documents rich in relevant
    information that aids disambiguation. Thus DPR''s contribution is a learned dense retrieval model, whereas Query2doc
    is a model-agnostic expansion technique that boosts BM25 by 3%–15% on ad-hoc IR datasets like MSMARCO and TREC
    DL without any fine-tuning, and also benefits state-of-the-art dense retrievers in-domain and out-of-domain.'
  gold_evidence:
  - 'the advances of reading comprehension models suggest a much simplified two-stage framework: (1) a context _retriever_
    first selects a small subset of passages where some of them contain the answer to the question, and then (2)
    a machine _reader_ can thoroughly examine the retrieved contexts and identify the correct answer (Chen et al.,
    2017). Although reducing open-domain QA to machine reading is a very reasonable strategy, a huge performance
    degradation is often observed in practice, indicating the needs of improving retrieval.'
  - This paper introduces a simple yet effective query expansion approach, denoted as _query2doc_ , to improve both
    sparse and dense retrieval systems. The proposed method first generates pseudo-documents by few-shot prompting
    large language models (LLMs), and then expands the query with generated pseudodocuments. LLMs are trained on
    web-scale text corpora and are adept at knowledge memorization. The pseudo-documents from LLMs often contain
    highly relevant information that can aid in query disambiguation and guide the retrievers. Experimental results
    demonstrate that _query2doc_ boosts the performance of BM25 by 3% to 15% on ad-hoc IR datasets, such as MSMARCO
    and TREC DL, without any model fine-tuning.

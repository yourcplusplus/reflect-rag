  question: How do Paper A and Paper B differ in their framing of the problem that retrieval augmentation is meant
    to solve, and in the type of contribution each makes?
  ground_truth: 'Paper A frames RAG as a broad solution to LLM limitations such as hallucination, outdated knowledge,
    and non-transparent, untraceable reasoning, emphasizing that RAG merges LLMs'' intrinsic knowledge with vast,
    dynamic external databases to improve accuracy and credibility, especially for knowledge-intensive tasks. It
    is a comprehensive survey that reviews the progression of RAG paradigms (Naive, Advanced, and Modular RAG),
    scrutinizes the tripartite foundation of retrieval, generation, and augmentation, and introduces an up-to-date
    evaluation framework and benchmark. Paper B, by contrast, focuses on a specific failure mode: LLMs inevitably
    manifest hallucinations due to factual errors and their inability to secure accuracy from parametric knowledge
    alone, and a low-quality retriever can introduce substantial irrelevant information that misleads the generator.
    Thus while Paper A offers a panoramic taxonomy and evaluation overview of RAG, Paper B diagnoses the retriever-quality
    problem and proposes a corrective approach (CRAG) to address it.'
  gold_evidence:
  - Large Language Models (LLMs) showcase impressive capabilities but encounter challenges like hallucination, outdated
    knowledge, and non-transparent, untraceable reasoning processes. Retrieval-Augmented Generation (RAG) has emerged
    as a promising solution by incorporating knowledge from external databases. This enhances the accuracy and credibility
    of the generation, particularly for knowledge-intensive tasks, and allows for continuous knowledge updates and
    integration of domainspecific information. RAG synergistically merges LLMs’ intrinsic knowledge with the vast,
    dynamic repositories of external databases. This comprehensive review paper offers a detailed examination of
    the progression of RAG paradigms, encompassing the Naive RAG, the Advanced RAG, and the Modular RAG. It meticulously
    scrutinizes the tripartite foundation of RAG frameworks, which includes the retrieval, the generation and the
    augmentation techniques.
  - 'Nevertheless, LLMs inevitably manifest hallucinations (Ji et al., 2023) due to their struggle with factual
    errors (Mallen et al., 2023; Min et al., 2023) and inability to secure the accuracy of generated texts solely
    by the parametric knowledge they encapsulate (Zhang et al., 2023b; Muhlgay et al., 2023). Figure 1: The examples
    show that a low-quality retriever is prone to introducing a substantial amount of irrelevant information, impeding
    the generators from acquiring accurate knowledge and potentially misleading them.'
  provenance: llm_synthesized

  question: How do E5 and HyDE differ in the way they achieve strong zero-shot retrieval performance without relevance
    labels?
  ground_truth: E5 attains zero-shot retrieval ability by training a dense embedding model contrastively on a large-scale
    curated text pair dataset (CCPairs) using weak supervision signals, and it is the first model to outperform
    the BM25 baseline on BEIR without any labeled data. HyDE, by contrast, trains no models at all, as the authors
    explicitly state that no models were trained or fine-tuned in producing their work. Instead of learning better
    embeddings, HyDE builds on existing supervised dense retrieval methods—which are typically improved via negative
    mining, distillation, and task-specific pre-training—and generates a hypothetical document whose embedding is
    used for retrieval. Thus E5 improves the embedding model itself through weakly-supervised contrastive pre-training,
    whereas HyDE leaves the retriever frozen and improves zero-shot retrieval at inference time.
  gold_evidence:
  - The model is trained in a contrastive manner with weak supervision signals from our curated large-scale text
    pair dataset (called CCPairs). E5 can be readily used as a general-purpose embedding model for any tasks requiring
    a single-vector representation of texts such as retrieval, clustering, and classification, achieving strong
    performance in both zero-shot and fine-tuned settings. ... For zero-shot settings, E5 is the first model that
    outperforms the strong BM25 baseline on the BEIR retrieval benchmark without using any labeled data.
  - Dense retrieval (Lee et al., 2019; Karpukhin et al., 2020), the method of retrieving documents using semantic
    embedding similarities, has been shown successful across tasks like web search, question answering, and fact
    verification. A variety of methods such as negative mining (Xiong et al., 2021; Qu et al., 2021), distillation
    (Qu et al., 2021; Lin et al., 2021b; Hofstätter et al., 2021) and task-specific pre-training (Izacard et al.,
    2021; Gao and Callan, 2021; Lu et al., 2021; Gao and Callan, 2022; Liu and Shao, 2022) have been proposed to
    improve the effectiveness of supervised dense retrieval models. ... 1No models were trained or fine-tuned in
    making this preprint.

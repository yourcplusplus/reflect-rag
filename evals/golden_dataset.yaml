  question: What is dense retrieval, and what methods have been proposed to improve the effectiveness of supervised
    dense retrieval models?
  ground_truth: Dense retrieval is the method of retrieving documents using semantic embedding similarities, and
    it has been shown successful across tasks like web search, question answering, and fact verification. To improve
    the effectiveness of supervised dense retrieval models, a variety of methods have been proposed, such as negative
    mining, distillation, and task-specific pre-training.
  gold_evidence:
  - Dense retrieval (Lee et al., 2019; Karpukhin et al., 2020), the method of retrieving documents using semantic
    embedding similarities, has been shown successful across tasks like web search, question answering, and fact
    verification. A variety of methods such as negative mining (Xiong et al., 2021; Qu et al., 2021), distillation
    (Qu et al., 2021; Lin et al., 2021b; Hofstätter et al., 2021) and task-specific pre-training (Izacard et al.,
    2021; Gao and Callan, 2021; Lu et al., 2021; Gao and Callan, 2022; Liu and Shao, 2022) have been proposed to
    improve the effectiveness of supervised dense retrieval models.
  provenance: extractive
  source_papers:

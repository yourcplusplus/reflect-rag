    the first model to beat BM25 on BEIR in a zero-shot setting. M3-Embedding is distinguished by multi-linguality,
    multi-functionality, and multi-granularity: it supports over 100 working languages, simultaneously performs
    dense, multi-vector, and sparse retrieval, and handles inputs from short sentences to 8,192-token documents.
    Thus, E5 emphasizes weakly-supervised general-purpose single-vector embeddings, whereas M3-Embedding emphasizes
    versatile multi-functional retrieval via self-knowledge distillation.'

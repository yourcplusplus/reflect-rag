  question: ReAct 与 RAG 都试图让语言模型突破"仅凭参数化知识作答"的局限，但二者在"模型与外部资源交互的方式"上采取了不同路线。请对比说明：ReAct 如何组织推理与行动的交替过程，RAG 又如何把检索结果接入生成过程，以及这种差异如何导致两者在知识更新与可解释性上的不同表现？
  ground_truth: ReAct 的核心是让语言模型在"推理轨迹（reasoning trace）"与"动作（action）"之间交替：模型先以自然语言生成思考，再调用外部工具（如 Wikipedia 搜索 API）获取观察结果，如此循环，从而把推理与行动交织在同一序列中。RAG
    则采用"检索器—生成器"的端到端架构，把预训练的稠密检索器（如 DPR）与序列到序列生成模型结合，将检索到的文档作为隐变量（latent variable）条件化到生成过程中，使模型在解码时直接依据外部文档而非仅依赖参数记忆。因此，RAG
    的知识更新只需替换非参数化的文档索引，无需重新训练模型，而 ReAct 的知识获取发生在推理时的工具调用中，同样避免了重训，但更依赖模型自主决定何时检索。在可解释性上，ReAct 的推理轨迹与动作步骤以自然语言显式呈现，人类可直接阅读其决策链条；RAG
    的可解释性则主要体现在检索到的证据文档上，生成过程本身仍是黑箱式的隐变量推断。
  gold_evidence:

  question: ColBERT achieves strong passage ranking through contextualized late interaction over BERT, but its design
    assumes a supervised setting with labeled relevance data. How does HyDE (Paper B) address the limitation that
    ColBERT-style dense retrieval models depend on relevance labels and task-specific training, and why does this
    matter for zero-shot retrieval?
  ground_truth: ColBERT improves retrieval effectiveness by applying BERT's contextualized representations through
    a late-interaction architecture, but like other dense retrieval models it relies on supervised relevance labels
    and task-specific training to be effective. HyDE addresses this by generating a hypothetical document from the
    query using an instruction-following language model, then encoding that synthetic document into an embedding
    for retrieval—without any relevance labels or model fine-tuning. This matters because it removes the dependency
    on labeled data and task-specific training that ColBERT-style models require, enabling precise zero-shot dense
    retrieval. Thus HyDE can be seen as directly tackling the supervision bottleneck that ColBERT's approach leaves
    unaddressed.
  gold_evidence:
  - ColBERT introduces a late interaction architecture that applies BERT's contextualized representations to rank
    passages efficiently and effectively, but it operates within a supervised ranking paradigm requiring labeled
    relevance data.
  - Dense retrieval has been shown successful across tasks like web search, question answering, and fact verification,
    with methods such as negative mining, distillation and task-specific pre-training proposed to improve the effectiveness
    of supervised dense retrieval models. HyDE generates a hypothetical document and encodes it into an embedding,
    requiring no relevance labels and no model training.
  provenance: llm_synthesized
  source_papers:
  - '2004.12832'
  - '2212.10496'
  source_sections:
  - 2004.12832#(front matter)
  - 2212.10496#(front matter)
  expected_intent: multi_hop
  expected_behavior: answer
  audit:
    sections:
    - (front matter)
    - (front matter)
    reasoning_bridge: ColBERT's conclusion that contextualized late interaction yields strong ranking still presupposes
      supervised relevance labels, and HyDE's contribution is precisely to eliminate that supervision requirement
      via hypothetical document generation, so understanding ColBERT's supervised limitation is necessary to appreciate
      what HyDE solves.
  verification:
    supported: false
    reason: The evidence supports that ColBERT requires labeled relevance data and that HyDE generates a hypothetical
      document and encodes it without relevance labels or training, but it never mentions an instruction-following

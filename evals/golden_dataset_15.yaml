  question: According to the passage, why do large language models inevitably manifest hallucinations?
  ground_truth: LLMs inevitably manifest hallucinations due to their struggle with factual errors and their inability
    to secure the accuracy of generated texts solely by the parametric knowledge they encapsulate. This is illustrated
    by examples where a low-quality retriever introduces irrelevant information that impedes generators from acquiring
    accurate knowledge.
  gold_evidence:
  - Nevertheless, LLMs inevitably manifest hallucinations (Ji et al., 2023) due to their struggle with factual errors
    (Mallen et al., 2023; Min et al., 2023) and inability to secure the accuracy of generated texts solely by the
    parametric knowledge they encapsulate (Zhang et al., 2023b; Muhlgay et al., 2023).
  provenance: extractive

  - AI-Agents-in-Depth-zh-CN
  question: ColBERT 通过"延迟交互"（late interaction）在 BERT 之上实现了高效且有效的段落检索，但它的架构本质上仍是一个"检索—排序"式的单轮信息获取模型。若把 ColBERT 视为一个
    Agent 的"检索工具"，那么按照《深入理解 AI Agent》一书的框架，ColBERT 缺少了现代 Agent 的哪些关键组成要素，才能被真正嵌入到 ReAct 循环中？
  ground_truth: ColBERT 的贡献在于用 late interaction 在 BERT 之上兼顾检索的效率与效果，但它本质上仍是一个被动的、单轮的"查询→排序"检索模型，只提供检索结果这一种输出，本身不具备与外部世界交互的接口。而《深入理解
    AI Agent》指出"现代 Agent = LLM + 上下文 + 工具"，其中工具是 Agent 的手脚、LLM 是大脑、上下文是眼睛，并通过 ReAct 循环（观察空间与动作空间）反复迭代。因此，若要把 ColBERT
    作为工具嵌入 Agent，它只充当了"检索"这一动作，缺少 LLM 推理大脑、观察/动作空间接口以及 ReAct 循环所要求的迭代式决策能力，必须由外层 Agent 框架补齐这些要素，ColBERT 才能从单轮排序器升级为可被反复调用的检索工具。
  gold_evidence:
  - 'ColBERT: Efficient and Effective Passage Search via Contextualized Late Interaction over BERT — 提出在 BERT 之上使用
    contextualized late interaction 进行段落检索，以兼顾效率与效果。'
  - 1.1 现代Agent = LLM + 上下文+ 工具；1.1.1 观察空间与动作空间：模型与世界的接口；1.1.2 工具：Agent 的手脚；1.1.3 LLM：Agent 的大脑；1.1.4 上下文：Agent
    的眼睛；1.1.5 ReAct 循环。
  provenance: llm_synthesized

  question: Both SELF-REFINE and SELF-RAG use self-generated signals to improve LLM outputs, but how do their mechanisms
    and training requirements differ?
  ground_truth: SELF-REFINE improves an LLM's initial output by having the same LLM generate feedback on its own
    output and then refine itself iteratively, requiring no supervised training data, additional training, or reinforcement
    learning—a single LLM acts as generator, refiner, and feedback provider. SELF-RAG, by contrast, is framed as
    a learning-based approach that trains the model to retrieve, generate, and critique through self-reflection,
    meaning it does rely on training rather than being a purely test-time, standalone method. Thus while SELF-REFINE
    is a training-free iterative refinement loop applied at test time across tasks like dialog and math reasoning,
    SELF-RAG incorporates retrieval and learned self-critique into the model itself. Both share the core idea of
    using self-feedback/self-reflection, but SELF-REFINE operates without any training while SELF-RAG is explicitly
    about learning to do so.
  gold_evidence:
  - SELF-REFINE does not require any supervised training data, additional training, or reinforcement learning, and
    instead uses a single LLM as the generator, refiner and the feedback provider.
  - 'SELF-RAG: LEARNING TO RETRIEVE, GENERATE, AND CRITIQUE THROUGH SELF-REFLECTION'

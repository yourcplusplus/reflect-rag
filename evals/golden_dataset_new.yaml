- question: How do UNREAL（2610.08463） and EC-RAG（2610.08674） differ in what they unify or structure for long-context/long-video
    understanding, and what mechanism does each use to achieve it?
  ground_truth: 'UNREAL（2610.08463）unifies retrieval and long-context processing within a single model, whereas
    EC-RAG（2610.08674）targets long video understanding by structuring retrieval around event chains. The two papers
    thus differ in both scope and mechanism: UNREAL collapses two traditionally separate capabilities (retrieval
    and long-context handling) into one unified model, while EC-RAG organizes retrieved content into an event-chain
    representation tailored to long video. Consequently, UNREAL''s contribution is architectural unification, while
    EC-RAG''s contribution is a retrieval-augmented generation scheme whose organizing principle is the event chain
    rather than the model itself.'

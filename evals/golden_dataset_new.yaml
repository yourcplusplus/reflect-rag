- question: 'How do the research goals and methodological approaches of "Agentic RAG Evaluation: Budget Allocation
    Across Questions, Trajectories, and Reads" (2610.05034) and "RAGShaper: Eliciting Sophisticated Agentic RAG
    Skills via Automated Data Synthesis" (2601.08699) differ in how they address Agentic RAG?'
  ground_truth: The two papers address Agentic RAG from complementary but distinct angles. Paper A (2610.05034)
    focuses on evaluation methodology, measuring how evaluation budgets should be allocated across questions, search
    trajectories, and repeated reads, using a retrieval-feedback comparison on HotpotQA and MuSiQue and metrics
    like allocation precision, reading efficiency, and cost boundaries. Paper B (2601.08699) instead targets data
    construction, proposing automated data synthesis to elicit sophisticated agentic RAG skills and overcome the
    limitations of human annotation. Thus, Paper A quantifies and forecasts evaluation budget trade-offs (e.g.,
    broader question coverage lowering standard error, temperature effects on answer disagreement), while Paper
    B builds training/evaluation data through an agent curator that curates distractors and elicits sophisticated
    trajectories. In short, Paper A studies how to evaluate Agentic RAG efficiently, whereas Paper B studies how
    to synthesize data that develops advanced Agentic RAG capabilities.
  gold_evidence:
  - Evaluation budgets in agentic retrieval-augmented generation span questions, search trajectories, and repeated
    answers. We measure allocation precision, reading efficiency, and cost boundaries using a retrieval-feedback
    comparison on HotpotQA and MuSiQue. At 34.14–34.39M model tokens, broader question coverage lowers standard
    error by 33% versus five reads and 12.6% versus three trajectories.
  - 'Agentic Retrieval-Augmented Generation (Agentic RAG) has emerged as a pivotal advancement in natural language
    processing, rapidly evolving from simple retrieval-and-read pipelines to autonomous systems capable of complex
    reasoning and dynamic tool usage... Figure 1: Limitations of human annotation of the agentic RAG dataset, which
    can be mitigated by automatic synthesis by the agent curator.'

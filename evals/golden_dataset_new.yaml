  ground_truth: CLIMB（2610.03421）的目标是提升 MRAG 的可靠性：它用置信度信号引导互补证据的选择与融合，以改善多模态检索增强生成中证据的充分性与答案质量，其结论与评估都围绕"生成质量/可靠性"展开，并未把"防止外部知识库被逆向提取"作为优化目标或威胁模型。而

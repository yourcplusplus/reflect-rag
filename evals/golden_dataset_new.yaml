- question: MatRAG（2610.01767）在摘要中宣称通过避免 KG 构建与 LLM 摘要、并用维度感知相似度降低查询开销来削减成本，但它并未讨论"关系无关（relation-free）图检索"中低查询相似度桥接证据被漏检的问题。NexusRAG（2609.37661）所提出的语料级实体邻域结构（联合实体共现
    + 语义相似度）与双路径传播，在多大程度上补上了 MatRAG 留下的这一缺口？换言之，若把 NexusRAG 的邻域约束语义传播与实体间结构传播机制引入 MatRAG 的 DAG 逐层遍历，能否缓解 MatRAG
    仅靠实体驱动重排与维度感知相似度时对低相似度桥接证据的漏检？
  ground_truth: MatRAG 的核心结论是：通过把聚类 DAG 的语义层级与 Matryoshka 嵌套维度对齐，并用实体驱动机制控制跳数与重排，可以在不建 KG、不做 LLM 摘要的前提下同时降低索引与查询成本，并在三个多跳
    QA 基准上取得优于七个基线的检索质量。但 MatRAG 的检索信号仍以查询—文档/实体相似度与维度感知相似度为主，其摘要并未处理"低查询相似度但位于推理链上的桥接证据"这一失效模式。NexusRAG 正是针对该失效模式：它指出关系无关图检索若只依赖查询—句子相似度，会排除低相似度的有用桥接证据、并激活与推理链无关的偶然实体；为此
    NexusRAG 在 Tri-Graph 上叠加语料级实体邻域结构（联合实体共现 + 语义相似度），用邻域约束的语义传播定位查询相关实体前沿，再用实体间的直接结构传播把前沿扩展到结构相关实体，并用传播权重初始化 Personalized
    PageRank。因此，把 NexusRAG 的双路径传播嵌入 MatRAG 的 DAG 逐层遍历，理论上能在保持 MatRAG 低成本（无 KG、无 LLM 摘要、低维索引）的同时，补上其对低相似度桥接证据的召回缺口——但代价是需额外构建并维护语料级实体邻域结构，这与
    MatRAG 削减索引成本的目标存在张力，二者结合属于"以适度索引开销换取桥接召回"的权衡，而非无代价的改进。
  gold_evidence:
  - '"MatRAG addresses both kinds of cost by aligning the semantic hierarchy of a clustering structure with the
    nested structure of MRL... MatRAG pairs an iterative, top-down traversal of the DAG with an entity-driven mechanism
    that controls the hop budget and re-ranks candidates... it reduces indexing costs by avoiding KG construction
    and LLM-based summarization, and lowers query-time costs through dimension-aware similarity."'

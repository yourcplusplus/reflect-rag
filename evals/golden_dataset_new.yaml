- question: How do RAG-PIBench (2610.08571) and RAGSTRESS (2610.04691) differ in what aspect of RAG trustworthiness
    they evaluate, and what do their respective findings reveal about RAG robustness?
  ground_truth: RAG-PIBench (2610.08571) targets the security of RAG systems against prompt-injection attacks embedded
    in retrieved content, offering a leakage-aware benchmark of 4,876 contextual examples with frozen train, validation,
    and protected-test splits to compare keyword-based, semantic-reference, TF-IDF, and transformer-based detectors.
    Its results show that DistilBERT achieves the best protected-test performance (F1 = 0.896, PRAUC = 0.968), while
    TF-IDF SVM and logistic regression remain competitive, underscoring the value of leakage-aware design and strong
    sparse baselines. RAGSTRESS (2610.04691), by contrast, evaluates RAG robustness under knowledge-base degradation
    rather than adversarial injection, pairing four naturalistic corruption types with three severity levels over
    57 MMLU subjects and 182,546 documents. Across 52,500 evaluations, RAGSTRESS finds that clean retrieval can
    mask robustness differences, semantic-fidelity corruptions are more harmful than signal-utility perturbations,
    and no-retrieval accuracy does not predict corrupted-retrieval robustness. Thus, RAG-PIBench addresses adversarial
    content injection detection, whereas RAGSTRESS addresses non-adversarial KB corruption stress-testing.
  gold_evidence:
  - We introduce RAG-PIBench, a benchmark for RAG-style prompt-injection detection containing 4,876 contextual examples
    across frozen train, validation, and protected-test splits. Using a leakage-aware construction pipeline and
    strict evaluation protocol, we compare keyword-based, semantic-reference, TF-IDF, and transformer-based detectors.
    DistilBERT achieves the best protected-test performance (F1 = 0.896, PRAUC = 0.968), while TF-IDF SVM and logistic
    regression remain competitive.
  - We introduce RAGSTRESS, a controlled evaluation benchmark for stress-testing RAG systems under systematic KB
    corruption. The benchmark pairs four naturalistic corruption types (factual corruption, numeric typo, relevance
    poisoning, contradiction injection) with three severity levels (subtle, moderate, obvious) over a single-KB,
    metadata-filtered experimental design built from 57 MMLU subjects and 182,546 documents. Across 52,500 model–question–condition
    evaluations, RAGSTRESS reveals that clean retrieval can mask robustness differences, semantic-fidelity corruptions
    are substantially more harmful than signal-utility perturbations, no-retrieval accuracy does not predict corrupted-retrieval
    robustness, and mixed-KB accuracy should not be treated as worst-case robustness.
  provenance: llm_synthesized

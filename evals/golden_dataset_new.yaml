- question: RAG-PIBench（2610.08571）通过其泄漏感知（leakage-aware）构建流程与严格评测协议，把提示注入检测的评测重点放在何处？而 RAGSTRESS（2610.04691）所针对的“知识库退化/污染”评测缺口，与
    RAG-PIBench 所处理的问题在威胁模型上有何本质区别，从而使 RAGSTRESS 无法直接复用 RAG-PIBench 的检测结论？
  ground_truth: RAG-PIBench（2610.08571）关注的是检索内容中被嵌入的提示注入攻击，其核心贡献是泄漏感知的基准构建流程与严格评测协议，用 4,876 条上下文样本比较关键词、语义参考、TF-IDF
    与 transformer 检测器，结论是 DistilBERT 在受保护测试集上最佳（F1=0.896，PRAUC=0.968），且 TF-IDF SVM 与逻辑回归等稀疏基线仍具竞争力。RAGSTRESS（2610.04691）关注的则是知识库本身被系统性污染（事实篡改、数字错字、相关性投毒、矛盾注入）时
    RAG 的鲁棒性，其结论是干净检索会掩盖鲁棒性差异、语义保真类污染比信号效用扰动危害更大、无检索准确率无法预测受污染检索下的鲁棒性。两者的本质区别在于威胁模型：RAG-PIBench 的威胁是“检索到的文本作为指令劫持生成”（对抗性指令注入，需要检测器判别），而
    RAGSTRESS 的威胁是“知识库内容本身失真”（数据质量退化，需要鲁棒性度量而非注入检测）。因此 RAGSTRESS 的污染类型与评测指标（52,500 次模型–问题–条件评测、四种污染×三级严重度）并不对应 RAG-PIBench
    的注入检测任务，RAG-PIBench 的检测器结论（如 DistilBERT 的 F1）也无法直接迁移用于评估 KB 污染下的鲁棒性。
  gold_evidence:
  - '"Retrieval-Augmented Generation (RAG) systems are vulnerable to prompt-injection attacks embedded in retrieved
    content. We introduce RAG-PIBench, a benchmark for RAG-style prompt-injection detection containing 4,876 contextual
    examples across frozen train, validation, and protected-test splits. Using a leakage-aware construction pipeline
    and strict evaluation protocol, we compare keyword-based, semantic-reference, TF-IDF, and transformer-based
    detectors. DistilBERT achieves the best protected-test performance (F1 = 0.896, PRAUC = 0.968), while TF-IDF
    SVM and logistic regression remain competitive."'
  - '"Retrieval-Augmented Generation (RAG) is typically evaluated under the implicit assumption that the underlying
    knowledge base (KB) is clean, leaving the behaviour of RAG systems under realistic KB degradation poorly characterised.
    We introduce RAGSTRESS, a controlled evaluation benchmark for stress-testing RAG systems under systematic KB
    corruption. The benchmark pairs four naturalistic corruption types (factual corruption, numeric typo, relevance
    poisoning, contradiction injection) with three severity levels (subtle, moderate, obvious)... RAGSTRESS reveals
    that clean retrieval can mask robustness differences, semantic-fidelity corruptions are substantially more harmful
    than signal-utility perturbations, no-retrieval accuracy does not predict corrupted-retrieval robustness, and
    mixed-KB accuracy should not be treated as worst-case robustness."'
